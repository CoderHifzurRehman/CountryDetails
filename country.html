<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Details</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="country.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="country.js" defer></script>
</head>
<body>
    <header class="header-container">
        <div class="header">
            <h1 class="title">
                <a href="index.html">
                    <i class="fa-solid fa-earth-americas brand-icon"></i>
                    <span>Where in the World?</span>
                </a>
            </h1>
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle Dark Mode">
                <i class="fa-solid fa-moon"></i>
                <span class="theme-text">Dark Mode</span>
            </button>
        </div>        
    </header>

    <main class="main-content">
        <div class="navigation-bar">
            <button class="back-btn" onclick="history.back()" aria-label="Go Back">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back</span>
            </button>
        </div>

        <div class="country-detail-wrapper" id="country-detail-wrapper">
            <!-- Dynamic country details will be injected here via country.js -->
            <div class="skeleton-detail">
                <div class="skeleton-img"></div>
                <div class="skeleton-text">
                    <div class="skeleton-title"></div>
                    <div class="skeleton-grid"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>Country Details Explorer &bull; Powered by REST Countries API</p>
    </footer>
</body>
</html>
